name: bsc-lab

services:
  bsc:
    image: ghcr.io/bnb-chain/bsc:${BSC_IMAGE_TAG:-1.8.2}
    user: "0:0"
    entrypoint: ["/bin/bash", "/lab/entrypoint.sh"]
    environment:
      CHAIN_ID: ${CHAIN_ID:-56056}
      GETH_CACHE: ${GETH_CACHE:-512}
      VALIDATOR_ADDRESS: ${VALIDATOR_ADDRESS:-0x9fB29AAc15b9A4B7F17c3385939b007540f4d791}
    volumes:
      - bsc-data:/data
      - ./chain:/lab:ro
      - lab-logs:/logs
    ports:
      - "${RPC_PORT:-8545}:8545"
      - "${WS_PORT:-8546}:8546"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "IP=$$(hostname -i | awk '{print $$1}'); curl -sf -H 'content-type: application/json' -d '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_blockNumber\",\"params\":[]}' http://$$IP:8545",
        ]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
    restart: unless-stopped

  deploy:
    build: ./deploy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      RPC_URL: http://host.docker.internal:${RPC_PORT:-8545}
      CHAIN_ID: ${CHAIN_ID:-56056}
      DEPLOYER_PRIVATE_KEY: ${FAUCET_PRIVATE_KEY:-0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
      DEPLOYMENTS_PATH: /data/deployments.json
      ACTIVITY_PATH: /data/activity.jsonl
    volumes:
      - lab-data:/data
      - lab-logs:/logs
    depends_on:
      bsc:
        condition: service_healthy
    restart: "no"

  blockscout-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: blockscout
      POSTGRES_PASSWORD: ${BLOCKSCOUT_DB_PASSWORD:-blockscout}
      POSTGRES_DB: blockscout
    ports:
      - "${BLOCKSCOUT_DB_PORT:-7432}:5432"
    volumes:
      - blockscout-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blockscout"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  blockscout-redis:
    image: redis:7-alpine
    ports:
      - "${BLOCKSCOUT_REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  blockscout:
    image: ghcr.io/blockscout/blockscout:${BLOCKSCOUT_IMAGE_TAG:-9.0.2}
    depends_on:
      bsc:
        condition: service_healthy
      blockscout-db:
        condition: service_healthy
      blockscout-redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BLOCKSCOUT_BACKEND_PORT:-4001}:4000"
    command: >
      sh -c "bin/blockscout eval \"Elixir.Explorer.ReleaseTasks.create_and_migrate()\" && bin/blockscout start"
    environment:
      DATABASE_URL: postgresql://blockscout:${BLOCKSCOUT_DB_PASSWORD:-blockscout}@host.docker.internal:${BLOCKSCOUT_DB_PORT:-7432}/blockscout
      ECTO_USE_SSL: "false"
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE}
      ETHEREUM_JSONRPC_HTTP_URL: http://host.docker.internal:${RPC_PORT:-8545}
      ETHEREUM_JSONRPC_TRACE_URL: http://host.docker.internal:${RPC_PORT:-8545}
      ETHEREUM_JSONRPC_WS_URL: ws://host.docker.internal:${WS_PORT:-8546}
      ETHEREUM_JSONRPC_VARIANT: geth
      CHAIN_ID: ${CHAIN_ID:-56056}
      COIN: BNB
      COIN_NAME: BNB
      NETWORK: BSC Lab
      SUBNETWORK: Local
      PORT: "4000"
      API_V2_ENABLED: "true"
      DISABLE_WEBAPP: "true"
      INDEXER_DISABLE_PENDING_TRANSACTIONS_FETCHER: "true"
      INDEXER_DISABLE_INTERNAL_TRANSACTIONS_FETCHER: ${INDEXER_DISABLE_INTERNAL_TRANSACTIONS_FETCHER:-true}
      POOL_SIZE: "10"
      ACCOUNT_ENABLED: "false"
      DISABLE_MARKET: "true"
      ACCOUNT_REDIS_URL: redis://host.docker.internal:${BLOCKSCOUT_REDIS_PORT:-16379}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:4000/api/v2/stats >/dev/null || wget -q -O /dev/null http://127.0.0.1:4000/api/v2/stats"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 90s

  blockscout-frontend:
    image: ghcr.io/blockscout/frontend:${BLOCKSCOUT_FRONTEND_TAG:-v2.3.5}
    ports:
      - "${BLOCKSCOUT_FRONTEND_PORT:-3001}:3000"
    depends_on:
      blockscout:
        condition: service_started
    environment:
      NEXT_PUBLIC_API_HOST: localhost
      NEXT_PUBLIC_API_PORT: ${BLOCKSCOUT_PORT:-4000}
      NEXT_PUBLIC_API_PROTOCOL: http
      NEXT_PUBLIC_APP_HOST: localhost
      NEXT_PUBLIC_APP_PORT: ${BLOCKSCOUT_PORT:-4000}
      NEXT_PUBLIC_APP_PROTOCOL: http
      NEXT_PUBLIC_API_WEBSOCKET_PROTOCOL: ws
      NEXT_PUBLIC_NETWORK_NAME: BSC Lab
      NEXT_PUBLIC_NETWORK_SHORT_NAME: Lab
      NEXT_PUBLIC_NETWORK_ID: ${CHAIN_ID:-56056}
      NEXT_PUBLIC_NETWORK_CURRENCY_NAME: BNB
      NEXT_PUBLIC_NETWORK_CURRENCY_SYMBOL: BNB
      NEXT_PUBLIC_NETWORK_CURRENCY_DECIMALS: "18"
      NEXT_PUBLIC_IS_TESTNET: "true"
    restart: unless-stopped

  blockscout-proxy:
    image: nginx:1.27-alpine
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - blockscout
      - blockscout-frontend
    volumes:
      - ./blockscout/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${BLOCKSCOUT_PORT:-4000}:80"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: crates/api/Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BIND: 0.0.0.0:8080
      CHAIN_ID: ${CHAIN_ID:-56056}
      CHAIN_NAME: BSC Lab
      RPC_URL: http://host.docker.internal:${RPC_PORT:-8545}
      PUBLIC_RPC_URL: ${PUBLIC_RPC_URL:-http://localhost:8545}
      PUBLIC_WS_URL: ${PUBLIC_WS_URL:-ws://localhost:8546}
      BLOCKSCOUT_PUBLIC_URL: ${BLOCKSCOUT_PUBLIC_URL:-http://localhost:4000}
      BLOCKSCOUT_INTERNAL_URL: http://blockscout-proxy
      SIWE_SCHEME: http
      SIWE_DOMAIN: ${SIWE_DOMAIN:-localhost:8080}
      SIWE_URI: ${SIWE_URI:-http://localhost:8080}
      COOKIE_SECURE: "false"
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      FAUCET_PRIVATE_KEY: ${FAUCET_PRIVATE_KEY:-0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
      ADMIN_ADDRESSES: ${ADMIN_ADDRESSES:-0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266,0x70997970C51812dc3A010C7d01b50e0d17dc79C8,0x9fB29AAc15b9A4B7F17c3385939b007540f4d791}
      DEV_ALLOW_OPEN_ADMIN: ${DEV_ALLOW_OPEN_ADMIN:-false}
      DATA_DIR: /data
      LOG_DIR: /logs
      STATIC_DIR: /app/console
      ARTIFACTS_PATH: /app/artifacts/pancake-v2.json
      DEV_ACCOUNTS_PATH: /app/dev-accounts.json
    volumes:
      - lab-data:/data
      - lab-logs:/logs
    ports:
      - "${ADMIN_PORT:-8080}:8080"
    depends_on:
      deploy:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

volumes:
  bsc-data:
  lab-data:
  lab-logs:
  blockscout-db:
